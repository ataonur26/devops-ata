name: Otomatik Docker İnşasi

on:
  push:
    branches: [ "main" ]

jobs:
  test-ve-insaa:
    runs-on: ubuntu-latest
    steps:
    - name: Depodaki Kodlari Sunucuya Çek
      uses: actions/checkout@v3
    
    - name: Docker İmajini Baştan Oluştur ve Test Et
      run: docker build -t python-uygulamasi-test .